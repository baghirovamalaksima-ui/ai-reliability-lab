[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-reliability-lab"
version = "0.1.0"
description = "Deterministic retrieval metrics and adversarial grounding evaluation"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
dependencies = []

[project.optional-dependencies]
test = ["pytest>=8,<10"]
multilingual = ["sentence-transformers>=3,<6"]

[tool.setuptools.packages.find]
include = ["core*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
markers = ["integration: optional tests that download a multilingual model"]
